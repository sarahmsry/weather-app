<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="style.css">
    <title>Weather App Practice</title>
</head>
<body>
    <div id="card">
        <div id="search">
            <input type = "text" placeholder="Enter City Name">
            <button><img src="images/search.png"></button>
        </div>
        <div id="error">
            <p>
                Invalid City Name
            </p>
        </div>
        <div id="weather">
            <img src="images/clear.png" id="weather-icon">
            <h1 id="temp">30°F</h1>
            <h2 id="city">Buford</h2>
            <div id="details">
                <div class="col">
                    <img src="images/humidity.png">
                    <div>
                        <p id="humidity">38%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png">
                    <div>
                        <p id="wind">8 mph</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
